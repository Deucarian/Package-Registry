name: Validate package registry

on:
  push:
    branches:
      - main
      - develop
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 3 * * *"

permissions:
  contents: read

jobs:
  validate-registry:
    name: Validate registry governance artifacts
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event_name == 'schedule' && 'develop' || github.ref }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.11"

      - name: Install audit parser
        shell: bash
        run: python -m pip install -r Tools/audit-requirements.txt

      - name: Run validator and audit tests
        shell: bash
        run: python -m unittest discover Tools/tests

      - name: Exercise deterministic catalog projection
        shell: bash
        run: |
          installer_root="$RUNNER_TEMP/package-installer"
          bootstrap_root="$RUNNER_TEMP/bootstrap"
          python Tools/project_package_catalogs.py \
            --installer-root "$installer_root" \
            --bootstrap-root "$bootstrap_root"
          python Tools/project_package_catalogs.py \
            --installer-root "$installer_root" \
            --bootstrap-root "$bootstrap_root" \
            --check

      - name: Validate Package Registry config
        shell: bash
        run: |
          python Tools/deucarian_package_validator.py \
            --ci \
            --registry-root . \
            --repository-root . \
            --config deucarian-package.json

      - name: Provision organization snapshots and check canonical audit
        shell: bash
        env:
          AUDIT_REF: ${{ github.event_name == 'schedule' && 'develop' || ((github.ref_name == 'main' || github.base_ref == 'main') && 'main' || 'develop') }}
        run: |
          set -euo pipefail

          audit_root="$RUNNER_TEMP/deucarian-org-audit"
          candidate_root="$RUNNER_TEMP/deucarian-registry-candidate"
          audit_registry="$audit_root/Package-Registry"

          python Tools/Generate-DeucarianAudit.py \
            --audit-root "$audit_root" \
            --output-root . \
            --organization Deucarian \
            --ref "$AUDIT_REF" \
            --authoritative \
            --format all \
            --provision \
            --provision-only

          test -d "$audit_registry"
          test "$audit_root" = "$RUNNER_TEMP/deucarian-org-audit"
          test "$candidate_root" = "$RUNNER_TEMP/deucarian-registry-candidate"
          rm -rf -- "$candidate_root"
          git clone --no-checkout "$GITHUB_WORKSPACE" "$candidate_root"
          git -C "$candidate_root" fetch "$GITHUB_WORKSPACE" HEAD
          candidate_commit="$(git -C "$candidate_root" rev-parse FETCH_HEAD)"
          git -C "$candidate_root" remote set-url origin "https://github.com/${GITHUB_REPOSITORY}.git"
          git -C "$candidate_root" update-ref "refs/heads/$AUDIT_REF" "$candidate_commit"
          git -C "$candidate_root" checkout --force "$AUDIT_REF"
          test -z "$(git -C "$candidate_root" status --porcelain)"
          test "$(git -C "$candidate_root" branch --show-current)" = "$AUDIT_REF"
          test "$(git -C "$candidate_root" rev-parse HEAD)" = "$(git -C "$candidate_root" rev-parse "refs/heads/$AUDIT_REF")"
          rm -rf -- "$audit_registry"
          mv "$candidate_root" "$audit_registry"

          python Tools/Generate-DeucarianAudit.py \
            --audit-root "$audit_root" \
            --output-root . \
            --organization Deucarian \
            --ref "$AUDIT_REF" \
            --authoritative \
            --format all \
            --check

      - name: Check organization AOT safety inventory
        shell: bash
        env:
          AUDIT_REF: ${{ github.event_name == 'schedule' && 'develop' || ((github.ref_name == 'main' || github.base_ref == 'main') && 'main' || 'develop') }}
        run: |
          python Tools/Generate-DeucarianAotAudit.py \
            --audit-root "$RUNNER_TEMP/deucarian-org-audit" \
            --output-root . \
            --organization Deucarian \
            --ref "$AUDIT_REF" \
            --check

      - name: Check compact Deucarian menu governance
        shell: bash
        run: |
          python Tools/deucarian_menu_audit.py \
            --audit-root "$RUNNER_TEMP/deucarian-org-audit" \
            --policy menu-policy.json \
            --output-root . \
            --check
