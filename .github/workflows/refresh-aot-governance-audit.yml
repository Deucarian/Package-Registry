name: Refresh AOT governance audit artifacts

on:
  push:
    branches:
      - feature/aot-safety-governance
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-aot-governance-audit
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'Deucarian/Package-Registry'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/aot-safety-governance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install audit parser
        run: python -m pip install -r Tools/audit-requirements.txt

      - name: Regenerate authoritative develop audit
        run: |
          python Tools/Generate-DeucarianAudit.py \
            --audit-root "$RUNNER_TEMP/deucarian-org-audit" \
            --output-root . \
            --organization Deucarian \
            --ref develop \
            --authoritative \
            --format all \
            --provision \
            --write

      - name: Commit refreshed artifacts when changed
        shell: bash
        run: |
          set -euo pipefail
          generated=(
            DUPLICATION_REPORT.json
            UNITY_OBJECT_LIFETIME_AUDIT.json
            DOCUMENTATION_DRIFT.json
            ARCHITECTURE_COMPLIANCE.json
            REUSE_AUDIT.md
            PACKAGE_CAPABILITY_MATRIX.md
            UNITY_OBJECT_LIFETIME_AUDIT.md
            DOCUMENTATION_DRIFT.md
            EXTRACTION_CANDIDATES.md
            ARCHITECTURE_COMPLIANCE.md
          )
          if git diff --quiet -- "${generated[@]}"; then
            echo 'Audit artifacts are already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add "${generated[@]}"
          git commit -m 'Refresh final AOT governance audit artifacts'
          git push origin HEAD:feature/aot-safety-governance
