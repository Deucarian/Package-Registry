name: Refresh AOT safety inventory

on:
  push:
    branches:
      - feature/aot-safety-governance
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: refresh-aot-safety-inventory
  cancel-in-progress: true

jobs:
  refresh:
    if: github.repository == 'Deucarian/Package-Registry'
    runs-on: ubuntu-latest
    timeout-minutes: 45

    steps:
      - name: Checkout feature branch
        uses: actions/checkout@v6
        with:
          ref: feature/aot-safety-governance
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.11'

      - name: Install audit parser
        run: python -m pip install -r Tools/audit-requirements.txt

      - name: Provision authoritative develop snapshots
        run: |
          python Tools/Generate-DeucarianAudit.py \
            --audit-root "$RUNNER_TEMP/deucarian-org-audit" \
            --output-root . \
            --organization Deucarian \
            --ref develop \
            --authoritative \
            --format all \
            --provision \
            --check

      - name: Generate AOT safety inventory
        run: |
          python Tools/Generate-DeucarianAotAudit.py \
            --audit-root "$RUNNER_TEMP/deucarian-org-audit" \
            --output-root . \
            --organization Deucarian \
            --ref develop \
            --write

      - name: Commit generated inventory when changed
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- AOT_SAFETY_AUDIT.json AOT_SAFETY_AUDIT.md; then
            echo 'AOT safety inventory is already current.'
            exit 0
          fi
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add AOT_SAFETY_AUDIT.json AOT_SAFETY_AUDIT.md
          git commit -m 'Generate organization AOT safety inventory'
          git push origin HEAD:feature/aot-safety-governance
